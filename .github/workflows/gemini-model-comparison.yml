name: Compare Gemini Support Models

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-model-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai==2.12.1

      - name: Compare old and candidate models without production writes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gemini_model_comparison.py \
            --audio episodes/podcast_20260706_051810.mp3 \
            --audio episodes/podcast_20260707_055519.mp3 \
            --audio episodes/podcast_20260720_064048.mp3 \
            --inbox-fixtures tests/fixtures/gemini_model_comparison_inbox.json \
            --output "${RUNNER_TEMP}/gemini-model-comparison.json"

      - name: Upload ephemeral comparison report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gemini-model-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gemini-model-comparison.json
          if-no-files-found: warn
          retention-days: 3
