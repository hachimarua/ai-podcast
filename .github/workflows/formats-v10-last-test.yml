name: Formats v10 final test patch

on:
  push:
    branches: [feature/formats-v10-editorial-flexibility]
    paths:
      - scripts/patch_formats_v10_last_test.py
      - .github/workflows/formats-v10-last-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/formats-v10-editorial-flexibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch stale assertion
        run: python scripts/patch_formats_v10_last_test.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_episode_formats.py
          git diff --cached --check
          git commit -m "test: align weekly regression with formats-v10 [formats-v10-test-fixed]"
          git push origin HEAD:feature/formats-v10-editorial-flexibility
