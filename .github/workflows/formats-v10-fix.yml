name: Formats v10 regression fixes

on:
  push:
    branches: [feature/formats-v10-editorial-flexibility]
    paths:
      - scripts/apply_formats_v10_regression_fixes.py
      - .github/workflows/formats-v10-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/formats-v10-editorial-flexibility
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply regression fixes
        run: python scripts/apply_formats_v10_regression_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script_generator.py news_collector.py tests/test_episode_formats.py tests/test_phase0_safety.py
          git diff --cached --check
          git commit -m "fix: preserve safety in formats-v10 editorial policy [formats-v10-fixed]"
          git push origin HEAD:feature/formats-v10-editorial-flexibility
