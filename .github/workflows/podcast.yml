name: Sarashina connection diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare authenticated and unauthenticated responses
        env:
          SARASHINA_API_KEY: ${{ secrets.SARASHINA_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          key = os.environ.get('SARASHINA_API_KEY', '')
          print(json.dumps({'utc': datetime.now(timezone.utc).isoformat(),
              'key_present': bool(key), 'key_has_surrounding_whitespace': key != key.strip()}))
          body = json.dumps({'model': 'sarashina3-mini', 'max_completion_tokens': 16,
              'messages': [{'role': 'system', 'content': '短く返答してください。'},
              {'role': 'user', 'content': '接続確認です。「確認」とだけ答えてください。'}]}).encode()
          for authenticated in (False, True):
              if authenticated and not key:
                  continue
              headers = {'Content-Type': 'application/json'}
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + key
              request = urllib.request.Request('https://api.sarashina.ai/v1/chat/completions',
                  data=body, headers=headers)
              try:
                  response = urllib.request.urlopen(request, timeout=25)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  print(json.dumps({'authenticated': authenticated, 'transport_error': type(error).__name__}))
                  continue
              raw = response.read(32768).decode('utf-8', errors='replace')
              result = {'authenticated': authenticated, 'status': response.status,
                  'content_type': response.headers.get('Content-Type', '').split(';')[0],
                  'cloudfront': 'cloudfront' in response.headers.get('Server', '').lower(),
                  'cloudfront_country_block': 'configured to block access from your country' in raw.lower(),
                  'cloudfront_request_blocked': 'request blocked' in raw.lower(),
                  'json_response': False}
              try:
                  payload = json.loads(raw)
                  result['json_response'] = True
                  result['choices_present'] = bool(payload.get('choices'))
                  result['unauthorized_message'] = payload.get('message') == 'Unauthorized'
                  result['forbidden_message'] = payload.get('message') == 'Forbidden'
              except (ValueError, AttributeError):
                  pass
              print(json.dumps(result))
