name: Generate Daily AI Podcast

on:
  schedule:
    # 毎朝 日本時間 4:17 (UTC 19:17)
    - cron: '17 19 * * *'
  workflow_dispatch: # 手動実行用
    inputs:
      bootstrap_only:
        description: "直近3放送のmanifest初期化だけを実行する"
        required: false
        type: boolean
        default: false
      qa_existing_only:
        description: "最新の既存MP3にGemini音声監査だけを実行する"
        required: false
        type: boolean
        default: false
      phase10_trial:
        description: "AI agentsテーマのLabをRSS非公開Artifactとして生成する"
        required: false
        type: boolean
        default: false
      weekly_lab_trial:
        description: "最新の公式実装テーマを選ぶWeekly LabをRSS非公開Artifactとして生成する"
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-ai-podcast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # リポジトリへのコミット＆プッシュ権限

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install system dependencies (ffmpeg)
      run: |
        if ! command -v ffmpeg &> /dev/null; then
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive\.ubuntu\.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
        else
          echo "ffmpeg is already installed; skipping apt-get."
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Bootstrap recent episode history once
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 音声監査は台本生成と分離したGemini 3.6 Flashで実行する。
        GEMINI_AUDIO_QA_MODEL: "gemini-3.6-flash"
      run: |
        manifest_count=$(find episode_manifests -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')
        if [ "$manifest_count" -eq 0 ]; then
          python bootstrap_episode_history.py --limit 3 --model "$GEMINI_AUDIO_QA_MODEL"
        else
          echo "Episode history already initialized; skipping bootstrap."
        fi

    - name: Process Notion Inbox
      if: ${{ github.event_name != 'workflow_dispatch' || (inputs.bootstrap_only != true && inputs.qa_existing_only != true && inputs.phase10_trial != true && inputs.weekly_lab_trial != true) }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        NOTION_INBOX_DATABASE_ID: ${{ secrets.NOTION_INBOX_DATABASE_ID }}
        BASE_URL: "https://hachimarua.github.io/ai-podcast"
        BGM_VOLUME: "0.30"
        ALLOW_MOCK_DATA: "false"
      run: |
        python process_inbox.py

    - name: Run Podcast Pipeline
      if: ${{ github.event_name != 'workflow_dispatch' || (inputs.bootstrap_only != true && inputs.qa_existing_only != true) }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        NOTION_INBOX_DATABASE_ID: ${{ secrets.NOTION_INBOX_DATABASE_ID }}
        BASE_URL: "https://hachimarua.github.io/ai-podcast"
        BGM_VOLUME: "0.30"
        ALLOW_MOCK_DATA: "false"
        # 台本生成は3.7 Flashの503集中を避け、3.1 Pro previewへ退避する。
        GEMINI_MODEL_NAME: "gemini-3.1-pro-preview"
        GEMINI_AUDIO_QA_MODEL: "gemini-3.6-flash"
        PHASE10_TRIAL_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase10_trial == true || inputs.weekly_lab_trial == true) }}
        PHASE10_TRIAL_ANCHOR: ${{ inputs.phase10_trial == true && 'ai_agents' || '' }}
      run: |
        python main.py

    - name: Upload non-public Lab trial
      if: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase10_trial == true || inputs.weekly_lab_trial == true) }}
      uses: actions/upload-artifact@v4
      with:
        name: non-public-lab-${{ github.run_id }}-${{ github.run_attempt }}
        path: phase10_trials/
        if-no-files-found: error
        retention-days: 3

    - name: Run Gemini QA against latest existing episode only
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.qa_existing_only == true }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_AUDIO_QA_MODEL: "gemini-3.6-flash"
      run: |
        latest_audio=$(find episodes -maxdepth 1 -name 'podcast_*.mp3' | sort | tail -1)
        episode_id=$(basename "$latest_audio" .mp3)
        broadcast_date=$(echo "$episode_id" | sed -E 's/podcast_([0-9]{4})([0-9]{2})([0-9]{2})_.*/\1-\2-\3/')
        python gemini_audio_qa.py "$latest_audio" --episode-id "$episode_id" --broadcast-date "$broadcast_date"

    - name: Commit and Push changes
      if: ${{ github.event_name != 'workflow_dispatch' || (inputs.phase10_trial != true && inputs.weekly_lab_trial != true) }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 変更されたファイルをステージング
        git add podcast.xml episodes/ episode_manifests/ quality_reports/
        
        # 変更がある場合のみコミット＆プッシュ
        if ! git diff --cached --quiet; then
          git commit -m "chore: Update daily podcast episode [skip ci]"
          git push
        else
          echo "No new podcast generated or files modified."
        fi
